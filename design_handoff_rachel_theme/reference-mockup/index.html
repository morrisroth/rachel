<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>רחל — Unified Theme Redesign</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* ════════════════════════════════════════════════════════════
     UNIFIED DESIGN SYSTEM — "Operational Command"
     Single source of truth used by every screen.
     ════════════════════════════════════════════════════════════ */
  :root {
    /* Paper / surface — warm neutral */
    --paper:     oklch(96% 0.010 80);
    --paper-2:   oklch(93.5% 0.012 80);
    --surface:   oklch(99% 0.005 80);
    --surface-2: oklch(97.5% 0.008 80);

    /* Ink — text & lines, also warm */
    --ink:       oklch(20% 0.012 80);
    --ink-2:     oklch(38% 0.012 80);
    --ink-3:     oklch(56% 0.012 80);
    --ink-4:     oklch(72% 0.012 80);
    --line:      oklch(86% 0.010 80);
    --line-2:    oklch(78% 0.012 80);
    --hairline:  oklch(91% 0.010 80);

    /* Single structural accent: operational green */
    --brand:     oklch(38% 0.08 165);
    --brand-2:   oklch(32% 0.08 165);
    --brand-bg:  oklch(94% 0.030 165);
    --brand-line: oklch(80% 0.060 165);

    /* Status (criticality only) */
    --ok:        oklch(48% 0.12 155);
    --ok-bg:     oklch(95% 0.035 155);
    --ok-line:   oklch(82% 0.070 155);

    --warn:      oklch(60% 0.14 65);
    --warn-bg:   oklch(96% 0.060 70);
    --warn-line: oklch(82% 0.110 70);

    --bad:       oklch(52% 0.18 28);
    --bad-bg:    oklch(96% 0.040 28);
    --bad-line:  oklch(82% 0.100 28);

    /* Radii — restrained */
    --r-1: 4px;
    --r-2: 8px;
    --r-3: 12px;

    /* Type */
    --font-ui:   'Heebo', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    /* Spacing scale */
    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;
    --s-7: 48px;

    /* Shadows — only modals/drawers */
    --shadow-modal: 0 24px 60px oklch(0% 0 0 / .18), 0 6px 16px oklch(0% 0 0 / .08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'kern' 1, 'liga' 1;
  }
  #root { min-height: 100%; }

  /* ── Atoms ──────────────────────────────────────────────── */
  .mono { font-family: var(--font-mono); font-feature-settings: 'tnum' 1; }
  .num  { font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-weight: 600; }
  .tag  {
    font: 600 10.5px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--ink-3);
  }
  .tag--ink { color: var(--ink-2); }
  .tag--brand { color: var(--brand); }
  .ruler {
    border: 0;
    height: 4px;
    background:
      linear-gradient(var(--ink) 0 0) top/100% 1px no-repeat,
      linear-gradient(var(--ink) 0 0) bottom/100% 1px no-repeat;
    margin: 0;
  }
  .ruler--soft {
    background:
      linear-gradient(var(--line-2) 0 0) top/100% 1px no-repeat,
      linear-gradient(var(--line-2) 0 0) bottom/100% 1px no-repeat;
  }
  .hr { height: 1px; background: var(--line); border: 0; margin: 0; }

  /* ── Buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 18px;
    font: 600 13.5px/1 var(--font-ui);
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    border-radius: var(--r-1);
    cursor: pointer;
    transition: transform .04s ease, background .1s ease, border-color .1s ease;
    white-space: nowrap;
    letter-spacing: .01em;
  }
  .btn:hover { background: oklch(28% 0.012 80); border-color: oklch(28% 0.012 80); }
  .btn:active { transform: translateY(1px); }
  .btn--brand { background: var(--brand); border-color: var(--brand); color: white; }
  .btn--brand:hover { background: var(--brand-2); border-color: var(--brand-2); }
  .btn--ghost {
    background: transparent; color: var(--ink); border-color: var(--line-2);
  }
  .btn--ghost:hover { background: var(--surface-2); border-color: var(--ink-2); }
  .btn--lg { padding: 14px 22px; font-size: 14px; }
  .btn--sm { padding: 7px 12px; font-size: 12.5px; }

  /* ── Inputs ─────────────────────────────────────────────── */
  .input, .select {
    width: 100%;
    padding: 10px 12px;
    font: 400 14px var(--font-ui);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: var(--r-1);
    outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .input:focus, .select:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px oklch(38% 0.08 165 / .14);
  }
  .input.num-input { font-family: var(--font-mono); font-weight: 600; letter-spacing: .04em; }
  .label {
    display: block; margin-bottom: 6px;
    font: 600 10.5px/1.2 var(--font-mono);
    color: var(--ink-3);
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  /* ── Chips ──────────────────────────────────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px;
    font: 600 11px/1.5 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: .08em;
    border-radius: var(--r-1);
    background: var(--surface-2);
    color: var(--ink-2);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .chip--ok   { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok-line); }
  .chip--bad  { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad-line); }
  .chip--warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .chip--brand { background: var(--brand-bg); color: var(--brand); border-color: var(--brand-line); }
  .chip--solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip--solid-brand { background: var(--brand); color: white; border-color: var(--brand); }

  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: currentColor; }

  /* ── Card / panel ───────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-2);
  }
  .panel-h {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .panel-h h3 { margin: 0; font: 600 15px var(--font-ui); }
  .panel-h .tag { font-size: 10px; }

  /* ── Table ──────────────────────────────────────────────── */
  .tbl {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13.5px;
  }
  .tbl th, .tbl td {
    text-align: right;
    padding: 11px 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .tbl th {
    font: 600 10.5px/1 var(--font-mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr:hover td { background: oklch(96% 0.010 80 / .5); }

  /* ── Brand crest (used identically on every screen) ────── */
  .crest {
    display: inline-flex; align-items: center; gap: 11px;
  }
  .crest .mark {
    width: 30px; height: 30px;
    background: var(--ink);
    color: var(--paper);
    display: grid; place-items: center;
    font: 800 13px var(--font-mono);
    letter-spacing: -.02em;
    border-radius: 3px;
    position: relative;
  }
  .crest .mark::after {
    content: '';
    position: absolute;
    inset: -3px;
    border: 1px solid var(--ink);
    border-radius: 5px;
    pointer-events: none;
  }
  .crest .name {
    font: 700 16px var(--font-ui);
    color: var(--ink);
    line-height: 1;
  }
  .crest .sub {
    font: 600 9.5px/1 var(--font-mono);
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--ink-3);
    margin-top: 4px;
  }

  /* Brand variant — green mark */
  .crest--brand .mark { background: var(--brand); color: white; }
  .crest--brand .mark::after { border-color: var(--brand); }

  /* ── Field / mode indicator ─────────────────────────────── */
  .mode-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px 5px 8px;
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    font: 600 11.5px/1 var(--font-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .mode-pill .dot { width: 6px; height: 6px; background: var(--ink-3); }
  .mode-pill.is-emergency { color: var(--bad); border-color: var(--bad-line); background: var(--bad-bg); }
  .mode-pill.is-emergency .dot { background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
  .mode-pill.is-routine .dot { background: var(--ok); }
  .mode-pill.is-routine { color: var(--ok); border-color: var(--ok-line); background: var(--ok-bg); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(.85); }
  }

  /* ── Phone frame ────────────────────────────────────────── */
  .phone {
    width: 390px;
    height: 760px;
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 36px;
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    box-shadow: 0 1px 0 oklch(100% 0 0 / .6) inset;
  }
  .phone-status {
    flex: 0 0 auto;
    height: 38px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    font: 700 12.5px var(--font-ui);
    color: var(--ink);
  }
  .phone-body { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; }

  /* ── KPI tile ───────────────────────────────────────────── */
  .kpi {
    padding: 16px 18px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-2);
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .kpi .lbl { font: 600 10px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .kpi .val { font: 800 32px/1 var(--font-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
  .kpi .meta { font: 500 11.5px/1.2 var(--font-mono); color: var(--ink-3); margin-top: 2px; }
  .kpi--brand .val { color: var(--brand); }
  .kpi--bad .val { color: var(--bad); }
  .kpi--warn .val { color: var(--warn); }

  /* ── Section header ─────────────────────────────────────── */
  .sec-title {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--ink);
    position: relative;
    margin-bottom: 18px;
  }
  .sec-title::before {
    content:'';
    position: absolute;
    inset-block-end: -4px; inset-inline: 0;
    height: 1px;
    background: var(--ink);
  }
  .sec-title h2 {
    margin: 0;
    font: 700 22px var(--font-ui);
    letter-spacing: -.01em;
  }
  .sec-title .meta { margin-inline-start: auto; font: 500 11px var(--font-mono); color: var(--ink-3); }

  /* ── Topbar (HQ) ────────────────────────────────────────── */
  .topbar {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid var(--ink);
    background: var(--surface);
  }
  .topbar nav { display: flex; gap: 2px; }
  .topbar nav a {
    padding: 8px 14px;
    font: 600 12.5px var(--font-ui);
    color: var(--ink-2);
    text-decoration: none;
    border-radius: var(--r-1);
    border: 1px solid transparent;
  }
  .topbar nav a:hover { background: var(--surface-2); }
  .topbar nav a.on {
    color: var(--ink);
    background: var(--paper-2);
    border-color: var(--line-2);
  }

  /* ── Drawer ─────────────────────────────────────────────── */
  .drawer-scrim {
    position: absolute; inset: 0;
    background: oklch(20% 0.012 80 / .42);
    z-index: 100;
    display: flex; justify-content: flex-start;
  }
  .drawer {
    width: min(560px, 70%);
    height: 100%;
    background: var(--paper);
    border-inline-end: 1px solid var(--ink);
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-modal);
  }

  /* ── Misc ───────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: oklch(0% 0 0 / .15); border-radius: 4px; }

  /* Loading dots */
  @keyframes dot-pulse {
    0%, 80%, 100% { opacity: .25; }
    40% { opacity: 1; }
  }
</style>
</head>
