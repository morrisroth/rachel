<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f9f7f4"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="/manifest.json"/>
<title>רחל — חמ״ל מרכזי (מטה)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Warm-neutral light theme — operational utility */
    --bg:        oklch(98% 0.008 80);
    --bg-2:      oklch(96% 0.010 80);
    --surface:   oklch(99.5% 0.005 80);
    --line:      oklch(89% 0.010 80);
    --line-2:    oklch(82% 0.012 80);
    --ink:       oklch(22% 0.012 80);
    --ink-2:     oklch(40% 0.012 80);
    --ink-3:     oklch(58% 0.012 80);

    /* Status — operational, share chroma */
    --ok:        oklch(58% 0.14 150);
    --ok-bg:     oklch(96% 0.040 150);
    --ok-line:   oklch(82% 0.090 150);

    --warn:      oklch(70% 0.14 70);
    --warn-bg:   oklch(96% 0.050 75);
    --warn-line: oklch(82% 0.110 75);

    --bad:       oklch(58% 0.18 28);
    --bad-bg:    oklch(96% 0.045 28);
    --bad-line:  oklch(82% 0.110 28);

    --accent:    oklch(48% 0.14 250);
    --accent-bg: oklch(95% 0.040 250);

    --radius: 6px;
    --radius-lg: 10px;
    --shadow-1: 0 1px 0 oklch(100% 0 0 / .5) inset, 0 1px 2px oklch(0% 0 0 / .05);
    --shadow-2: 0 1px 0 oklch(100% 0 0 / .5) inset, 0 8px 24px oklch(0% 0 0 / .08);

    --font-ui:   'Heebo', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #root { min-height: 100%; }

  /* Common atoms */
  .mono { font-family: var(--font-mono); font-feature-settings: 'tnum' 1; }
  .num  { font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-weight: 500; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px;
    font: 500 14px/1 var(--font-ui);
    background: var(--ink);
    color: oklch(98% 0.005 80);
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform .04s ease, background .1s ease;
    white-space: nowrap;
  }
  .btn:hover { background: oklch(28% 0.012 80); }
  .btn:active { transform: translateY(1px); }
  .btn--ghost {
    background: transparent; color: var(--ink); border-color: var(--line-2);
  }
  .btn--ghost:hover { background: var(--bg-2); }
  .btn--accent { background: var(--accent); border-color: var(--accent); color: white; }
  .btn--accent:hover { background: oklch(42% 0.14 250); }
  .btn--lg { padding: 14px 22px; font-size: 15px; }
  .btn--sm { padding: 7px 11px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .input, .select {
    width: 100%;
    padding: 10px 12px;
    font: 400 15px var(--font-ui);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .input:focus, .select:focus {
    border-color: var(--ink-2);
    box-shadow: 0 0 0 3px oklch(22% 0.012 80 / .08);
  }
  .input.num-input { font-family: var(--font-mono); font-weight: 500; }

  .label {
    display: block; margin-bottom: 6px;
    font: 500 12px/1.2 var(--font-ui);
    color: var(--ink-2);
    letter-spacing: .02em;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px;
    font: 500 12px/1.5 var(--font-ui);
    border-radius: 999px;
    background: var(--bg-2);
    color: var(--ink-2);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .chip--ok   { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok-line); }
  .chip--bad  { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad-line); }
  .chip--warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .chip--accent { background: var(--accent-bg); color: var(--accent); border-color: oklch(82% 0.06 250); }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
  }

  .hr { height: 1px; background: var(--line); border: 0; margin: 0; }

  /* Focus rings */
  :focus-visible { outline: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0% 0 0 / .12); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: oklch(0% 0 0 / .22); }

  /* Tables (HQ) */
  .tbl {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 14px;
  }
  .tbl th, .tbl td {
    text-align: right;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
  }
  .tbl th {
    font: 600 11px/1 var(--font-ui);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    background: var(--bg-2);
    border-bottom-color: var(--line-2);
    position: sticky; top: 0;
  }
  .tbl tr:hover td { background: oklch(96% 0.008 80 / .6); }
  .tbl tr:last-child td { border-bottom: 0; }

  /* Dense table for inventory rows */
  .rowgrid {
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr 1.2fr 1.2fr 28px;
    gap: 8px;
    align-items: center;
  }
  .rowgrid--head {
    font: 600 11px/1 var(--font-ui);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 0 4px 6px;
  }

  /* HQ shell — in RTL, first column is RIGHT side */
  .hq-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 220px; /* main right, sidebar left in RTL */
  }
  .hq-side {
    background: var(--surface);
    border-inline-start: 1px solid var(--line);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .hq-main { padding: 24px 28px 64px; min-width: 0; }
  @media (max-width: 1100px) {
    .hq-shell { grid-template-columns: 1fr 200px; }
    .hq-main { padding: 20px 20px 56px; }
  }
  .hq-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 1100px) { .hq-kpis { grid-template-columns: repeat(2, 1fr); } }
  .min-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 1100px) { .min-grid { grid-template-columns: 1fr; } }

  /* Top bar */
  .topbar {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  /* Banner */
  .banner {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
    border: 1px solid;
    border-radius: var(--radius);
  }
  .banner--bad  { background: var(--bad-bg);  border-color: var(--bad-line);  color: var(--bad); }
  .banner--ok   { background: var(--ok-bg);   border-color: var(--ok-line);   color: var(--ok); }
  .banner--warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }

  /* KBD-like crest */
  .crest {
    display: inline-flex; align-items: center; gap: 10px;
    font: 700 15px var(--font-ui);
  }
  .crest .mark {
    width: 28px; height: 28px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    display: grid; place-items: center;
    font: 800 12px var(--font-mono);
    letter-spacing: -.02em;
  }

  /* Login bg */
  .login-stage {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    background:
      radial-gradient(1200px 600px at 30% -10%, oklch(95% 0.020 80), transparent 60%),
      radial-gradient(800px 400px at 90% 110%, oklch(95% 0.030 250 / .4), transparent 60%),
      var(--bg);
  }

  /* Density modifier */
  .density-compact .tbl th, .density-compact .tbl td { padding: 8px 12px; }
  .density-compact .input, .density-compact .select { padding: 8px 10px; font-size: 14px; }

  /* Drawer / side modal (HQ Add Organization) */
  .drawer-scrim {
    position: fixed; inset: 0;
    background: oklch(0% 0 0 / .32);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: flex; justify-content: flex-start;
    animation: scrim-in .2s ease-out;
  }
  @keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
  .drawer {
    width: min(720px, 100%);
    height: 100vh;
    background: var(--bg);
    border-inline-end: 1px solid var(--line);
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px oklch(0% 0 0 / .25);
  }
  .drawer-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 24px 8px;
  }
  @keyframes drawer-in {
    from { transform: translateX(-30px); opacity: 0; }
    to   { transform: translateX(0);     opacity: 1; }
  }
  .drawer.anim-in { animation: drawer-in .22s ease-out; }
  body.dark .drawer-scrim { background: oklch(0% 0 0 / .55); }

  /* Animations */
  @keyframes slide-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .anim-in { animation: slide-up .24s ease-out both; }

  /* Tag font feature */
  body { font-feature-settings: 'kern' 1, 'liga' 1; }

  /* Print/Sticky polish */
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num-input { -moz-appearance: textfield; }

  /* RTL fixes */
  .tbl th, .tbl td { text-align: right; }

  /* Pill toggle */
  .pill-toggle {
    display: inline-flex;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .pill-toggle button {
    appearance: none; border: 0; background: transparent;
    padding: 7px 14px;
    font: 500 13px var(--font-ui);
    color: var(--ink-2);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .pill-toggle button.on {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-1);
  }

  /* Persona card */
  .persona {
    display: flex; align-items: center; gap: 14px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    text-align: right;
    transition: border-color .1s ease, transform .04s ease;
  }
  .persona:hover { border-color: var(--ink-2); }
  .persona:active { transform: translateY(1px); }
  .persona .av {
    width: 40px; height: 40px;
    border-radius: 8px;
    display: grid; place-items: center;
    font: 700 14px var(--font-mono);
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--ink-2);
  }

  /* Dark mode override */
  body.dark {
    --bg:        oklch(20% 0.012 80);
    --bg-2:      oklch(23% 0.012 80);
    --surface:   oklch(25% 0.012 80);
    --line:      oklch(32% 0.012 80);
    --line-2:    oklch(38% 0.012 80);
    --ink:       oklch(95% 0.008 80);
    --ink-2:     oklch(78% 0.010 80);
    --ink-3:     oklch(60% 0.010 80);
    --ok-bg:     oklch(30% 0.05 150);
    --warn-bg:   oklch(30% 0.05 70);
    --bad-bg:    oklch(30% 0.05 28);
    --accent-bg: oklch(30% 0.05 250);
  }
  body.dark .tbl th { background: var(--bg-2); }

  /* ── Mobile / tablet responsive ─────────────────────────── */
  @media (max-width: 900px) {
    .hq-shell {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }
    /* Sidebar becomes a top nav bar */
    .hq-side {
      border-inline-start: none;
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .hq-side nav {
      flex-direction: row !important;
      flex-wrap: nowrap;
      gap: 2px;
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
    }
    .hq-side nav button {
      white-space: nowrap;
      padding: 7px 10px !important;
      font-size: 13px !important;
    }
    .hq-side > .card,
    .hq-side > .hr,
    .hq-side > div:last-child { display: none; }
    .hq-main { padding: 14px 14px 60px; }
    .hq-kpis { grid-template-columns: repeat(2, 1fr); }
    .min-grid { grid-template-columns: 1fr; }
    .tbl th, .tbl td { padding: 8px 10px; font-size: 13px; }
    /* Hide less critical columns on mobile */
    .tbl th:nth-child(3), .tbl td:nth-child(3),
    .tbl th:nth-child(4), .tbl td:nth-child(4) { display: none; }
    .drawer { width: 100%; }
  }
  @media (max-width: 560px) {
    .hq-kpis { grid-template-columns: 1fr 1fr; }
    .hq-main { padding: 12px 10px 60px; }
  }
</style>
